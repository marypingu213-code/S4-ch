<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第六課 臺灣的驕傲｜課文動起來</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif;
  --bg:#E3EFF3; --panel:#FFFFFF; --ink:#1E2B33; --soft:#5B6B74;
  --red:#C7352B; --river:#3B8EA5; --jade:#3E8C80; --gold:#EE9B1C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14232B; --panel:#1D323D; --ink:#EAF2F5; --soft:#A9BCC5; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kai);background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:1.4vw;padding:1vh 1.6vw .8vh;flex-wrap:wrap}
h1{margin:0;font-size:4.4vh;color:var(--red);letter-spacing:.12em;white-space:nowrap}
h1 small{font-size:.55em;color:var(--soft);letter-spacing:.05em;margin-right:.4em}
nav{display:flex;gap:.6vw;flex-wrap:wrap}
nav button{font:inherit;font-size:2.5vh;padding:.6vh 1.1vw;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
nav button.on{background:var(--panel);border-color:var(--red);color:var(--red);font-weight:700}
main{display:grid;grid-template-columns:1fr 50vh;gap:1.2vw;padding:0 1.6vw 1.4vh;min-height:0}
.stagewrap{display:grid;grid-template-rows:1fr auto;gap:1vh;min-height:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#DCEFF6;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene>svg{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;z-index:5}
.acts{display:flex;flex-wrap:wrap;gap:.7vw;min-height:6vh;align-items:center}
.acts button{font:inherit;font-size:2.7vh;padding:.9vh 1.5vw;border-radius:999px;border:3px solid var(--red);background:var(--panel);color:var(--ink);cursor:pointer}
.acts button:hover{background:var(--red);color:#fff}
button:focus-visible,.v:focus-visible,.cell:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
aside{background:var(--panel);border-radius:20px;padding:1.6vh 1.4vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:1vh;min-height:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh;color:var(--soft)}
.ptitle b{color:var(--red);font-size:1.15em}
.txt{writing-mode:vertical-rl;font-size:4.3vh;line-height:1.85;letter-spacing:.06em;width:100%;height:100%;min-height:0;overflow:auto;display:block}
.v{border:2px solid var(--gold);border-radius:6px;cursor:pointer;color:#1F7F9E;padding:.1em 0}
@media (prefers-color-scheme: dark){ .v{color:#7FD0EA} }
.pnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.8vh}
.pnav button{font:inherit;font-size:2.6vh;padding:1vh 0;border-radius:12px;border:2px solid var(--soft);background:transparent;color:var(--ink);cursor:pointer}
.pnav .say{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
#pop{position:fixed;left:3vw;bottom:13vh;max-width:48vw;background:#FFFFFF;color:#1E2B33;border:4px solid var(--gold);border-radius:16px;padding:1.4vh 1.6vw;font-size:3vh;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:20}
#pop.on{display:block;animation:pop .3s}
#pop h3{margin:0 0 .4vh;color:#C7352B;font-size:1.25em}
#pop .row{display:flex;gap:1vw;margin-top:.8vh}
#pop button{font:inherit;font-size:.85em;border-radius:10px;border:2px solid #C7352B;background:#fff;color:#C7352B;padding:.3vh 1vw;cursor:pointer}

/* overlay pieces */
.badge{position:absolute;background:#fff;color:#1E2B33;border:4px solid var(--red);border-radius:14px;padding:.6vh 1.1vw;font-size:3.1vh;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.6,1);white-space:nowrap}
.badge.gold{border-color:var(--gold)}
.badge.jade{border-color:var(--jade)}
.badge s{color:#888}
.big{position:absolute;font-size:9vh;font-weight:700;color:#fff;-webkit-text-stroke:3px #C7352B;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .3s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- bridge ---------- */
.arch{fill:none;stroke:#C7352B;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;transition:opacity .25s}
.building .arch{opacity:0}
.building .arch.show{opacity:1}
.arch.hi{stroke:#F7B731;stroke-width:6}
.wave .arch{animation:redwave 1s ease-in-out;animation-delay:calc(var(--i) * 45ms)}
@keyframes redwave{50%{stroke:#FFD43B;stroke-width:7}}
.pier{fill:#BDB6AA;stroke:#8C857A;stroke-width:1.5}
.pier.hi{fill:#F7B731}
#giants,#fest,#house,#cars{display:none}
.giants #giants,.fest #fest,.house #house,.driving #cars{display:inline}
.car{animation:drive 9s linear infinite}
.car.c2{animation-delay:-4.5s;animation-direction:reverse}
@keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(1090px)}}
#bridgeAll.shake{animation:shake .14s 16}
@keyframes shake{25%{transform:translate(-7px,2px)}75%{transform:translate(7px,-2px)}}
#riverG{transition:transform 1.6s ease-in-out}
.flood #riverG{transform:translateY(-40px)}
.waves{animation:flow 3s linear infinite}
@keyframes flow{to{transform:translateX(-80px)}}
.glowbridge .arch{stroke:#FF4B3E;filter:drop-shadow(0 0 6px #ff7a5c)}
.note{position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-50%) rotate(-3deg);background:linear-gradient(135deg,#E8E2C8,#D8D0A8);border:6px double #7A6A3A;border-radius:10px;padding:2vh 2vw;color:#4A3F1E;animation:pop .5s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.note .nt{display:flex;justify-content:space-between;font-size:3vh;font-weight:700}
.note svg{width:100%;height:auto;display:block;margin:1vh 0}
.note .nb{font-size:2.2vh;text-align:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,26,.85);display:none;align-items:center;justify-content:center;z-index:30;padding:3vh 3vw}
.modal.on{display:flex}
.mbox{background:#fff;color:#1E2B33;border-radius:18px;padding:2vh 2vw;max-width:92vw;max-height:94vh;display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.mbox h3{margin:0;color:#C7352B;font-size:3.4vh}
.mbox img{max-height:66vh;max-width:84vw;border-radius:8px;display:block}
.mbox .cap{font-size:2.8vh;text-align:center;line-height:1.5}
.mbox iframe{border:0;border-radius:10px;background:#000}
.mbox .mrow{display:flex;gap:1vw}
.mbox .mrow a,.mbox .mrow button{font:inherit;font-size:2.6vh;border-radius:12px;border:3px solid #C7352B;background:#fff;color:#C7352B;padding:.6vh 1.4vw;cursor:pointer;text-decoration:none}
.cell .nlink{border-bottom:3px solid #EE9B1C;color:#1F7F9E;cursor:pointer;font-weight:700}
/* ---------- tower ---------- */
#skyR{fill:url(#day);transition:fill 1s}
.night #skyR{fill:url(#night)}
#stars{opacity:0;transition:opacity 1s}
.night #stars{opacity:1}
.sec{fill:url(#glass);stroke:#2E6A61;stroke-width:1.6;transition:opacity .45s}
.stacking .sec{opacity:0}
.stacking .sec.show{opacity:1}
.cut .sec,.cut .podium{opacity:.28}
.win{stroke:rgba(255,255,255,.45);stroke-width:1}
.night .win{stroke:#FFE58A}
.night .sec{stroke:#7FE0CF}
#damper,#elevG,#people,#gaze,#ding{display:none}
.cut #damper,.elev #elevG,.walk #people,.gaze #gaze,.ding #ding{display:inline}
.sym{transform-box:fill-box;transform-origin:center}
.sym.hi{animation:pulse .6s 5}
@keyframes pulse{50%{transform:scale(1.9)}}
#riseG.rise{animation:rise 3.2s ease-out}
@keyframes rise{from{transform:translateY(470px)}to{transform:translateY(0)}}
.walker{animation:walk 10s linear infinite}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(1000px)}}
.walker.back{animation-direction:reverse}
.spark{animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.lbl{font-family:var(--kai);font-weight:700}

/* ---------- map ---------- */
.pin{cursor:pointer}
.pin circle.ring{animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.tw{animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}

/* ---------- heights ---------- */
.html{background:linear-gradient(#BFE3F0,#EAF6FA)}
.bars{position:absolute;inset:6% 4% 4%;display:flex;gap:2.5%;align-items:stretch}
.bitem{flex:1;display:flex;flex-direction:column;min-width:0}
.bcol{flex:1;position:relative}
.bshape{position:absolute;bottom:0;left:15%;right:15%;height:0;transition:height 1.6s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,#6FA9B4,#A9D3D8 45%,#5C949F);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.bitem.me .bshape{background:linear-gradient(90deg,#2F7A6E,#7CC6B6 45%,#2F7A6E);clip-path:polygon(40% 0,60% 0,85% 100%,15% 100%)}
.bitem.br .bshape{background:repeating-linear-gradient(0deg,#C7352B 0 6px,transparent 6px 22px),repeating-linear-gradient(90deg,#C7352B 0 5px,transparent 5px 100%);left:30%;right:30%;clip-path:none;border-left:5px solid #C7352B;border-right:5px solid #C7352B}
.bnum{position:absolute;left:0;right:0;text-align:center;font-size:3.4vh;font-weight:700;color:#1E2B33;transition:bottom 1.6s cubic-bezier(.2,.8,.2,1)}
.bitem.me .bnum{color:#C7352B;font-size:4.2vh}
.bname{text-align:center;font-size:2.7vh;color:#1E2B33;padding-top:.6vh;border-top:4px solid #6B5B45;line-height:1.3}
.bname span{display:block;font-size:.8em;color:#4F5F68}
.bitem.br{display:none}
.showbr .bitem.br{display:flex}

/* ---------- 5W ---------- */
.wgrid{position:absolute;inset:3% 3%;display:grid;grid-template-columns:12% 1fr 1fr;grid-template-rows:auto repeat(5,1fr);gap:1vh;font-size:3vh;color:#1E2B33}
.wgrid .hd{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:3.4vh;border-radius:12px;padding:.6vh}
.wgrid .hd.b{background:#C7352B;color:#fff}.wgrid .hd.t{background:#2F7A6E;color:#fff}
.wgrid .k{display:flex;align-items:center;justify-content:center;font-size:5vh;font-weight:700;color:#C7352B;background:#fff;border-radius:12px}
.cell{position:relative;background:#fff;border-radius:12px;padding:.6vh 1vw;display:flex;align-items:center;cursor:pointer;line-height:1.4;overflow:hidden}
.cell .cover{position:absolute;inset:0;background:#F6C14B;display:flex;align-items:center;justify-content:center;font-size:3vh;color:#6A4A00;transition:transform .45s}
.cell.open .cover{transform:translateY(-102%)}
.quiz{position:absolute;inset:0;background:rgba(20,35,43,.82);display:none;align-items:center;justify-content:center;z-index:8}
.quiz.on{display:flex}
.qbox{background:#fff;color:#1E2B33;border-radius:20px;padding:3vh 3vw;text-align:center;min-width:55%}
.qword{font-size:7vh;font-weight:700;color:#C7352B;margin:1vh 0 2vh}
.qbtns{display:flex;gap:1.2vw;justify-content:center}
.qbtns button{font:inherit;font-size:5vh;width:11vh;height:11vh;border-radius:50%;border:4px solid #2F7A6E;background:#fff;color:#2F7A6E;cursor:pointer}
.qfb{font-size:3.4vh;min-height:5vh;margin-top:2vh}
.qbox .close{font:inherit;font-size:2.4vh;margin-top:1vh;background:none;border:2px solid #999;border-radius:10px;padding:.4vh 1.2vw;cursor:pointer}

.crown{transition:transform 2.2s ease-in,opacity 2.2s}
.crown.off{transform:translateY(-260px);opacity:0}
.heart{opacity:0;transition:opacity 1s}
.heart.on{opacity:1}

@media (max-width:820px), (max-aspect-ratio:1/1){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  .stage{height:58vh}
  aside{min-height:auto}
  .txt{writing-mode:horizontal-tb;height:auto;font-size:22px}
  .acts button,.pnav button,nav button{font-size:17px}
  h1{font-size:26px}
}
@media (prefers-reduced-motion: reduce){
  .waves,.walker,.tw,.pin circle.ring{animation:none}
}
</style>
</head>
<body>
<header>
  <h1><small>第六課</small>臺灣的驕傲</h1>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage">

      <!-- MAP -->
      <div class="scene" id="sc-map">
        <svg viewBox="-150 -10 732 590" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD3E6"/><stop offset="1" stop-color="#6FB6D0"/></linearGradient>
          </defs>
          <rect x="-150" y="-10" width="732" height="590" fill="url(#sea)"/>
          <path d="M311,30 L351,52 L396,73 L369,135 L372,138 L328,228 L284,360 L243,412 L198,472 L189,540 L166,535 L140,470 L86,432 L50,375 L63,318 L63,270 L99,217 L126,184 L198,102 L225,67 L290,48 Z"
                fill="#9BCB7A" stroke="#4E7A3A" stroke-width="4" stroke-linejoin="round"/>
          <path d="M318,80 L340,150 L300,250 L250,360 L215,450" fill="none" stroke="#6E9A55" stroke-width="18" stroke-linecap="round" opacity=".45"/>
          <path d="M228,255 Q160,262 120,250 T66,248" fill="none" stroke="#2F86B0" stroke-width="5" stroke-linecap="round"/>
          <text x="-40" y="244" font-size="22" fill="#1F5F80" class="lbl">濁水溪</text>
          <g id="mapStars"></g>
          <g class="pin" id="pinY" tabindex="0">
            <circle class="ring" cx="120" cy="262" r="14" fill="none" stroke="#C7352B" stroke-width="4"/>
            <circle cx="120" cy="262" r="11" fill="#C7352B" stroke="#fff" stroke-width="3"/>
            <rect x="-138" y="280" width="246" height="52" rx="12" fill="#fff" stroke="#C7352B" stroke-width="4"/>
            <text x="-15" y="316" text-anchor="middle" font-size="28" fill="#C7352B" class="lbl">雲林・西螺大橋</text>
          </g>
          <g class="pin" id="pinT" tabindex="0">
            <circle class="ring" cx="317" cy="70" r="14" fill="none" stroke="#2F7A6E" stroke-width="4"/>
            <circle cx="317" cy="70" r="11" fill="#2F7A6E" stroke="#fff" stroke-width="3"/>
            <rect x="352" y="40" width="200" height="52" rx="12" fill="#fff" stroke="#2F7A6E" stroke-width="4"/>
            <text x="452" y="76" text-anchor="middle" font-size="28" fill="#2F7A6E" class="lbl">臺北一〇一</text>
          </g>
          <text x="420" y="470" font-size="40" fill="#fff" class="lbl" stroke="#2F6F8F" stroke-width="6" paint-order="stroke">寶島臺灣</text>
        </svg>
      </div>

      <!-- BRIDGE -->
      <div class="scene" id="sc-bridge">
        <svg id="bsvg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DD3EC"/><stop offset="1" stop-color="#E6F5FA"/></linearGradient>
          </defs>
          <rect width="1000" height="560" fill="url(#bsky)"/>
          <path d="M0,330 Q120,240 260,300 T520,280 T800,290 T1000,270 L1000,460 L0,460Z" fill="#B7D8A8" opacity=".7"/>
          <g id="riverG">
            <rect x="0" y="440" width="1000" height="160" fill="#4E97AE"/>
            <g class="waves" stroke="#BFE6F2" stroke-width="3" fill="none" opacity=".8">
              <path d="M0,470 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"/>
              <path d="M20,510 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"/>
            </g>
            <text x="840" y="545" font-size="28" fill="#fff" class="lbl">濁水溪</text>
          </g>
          <ellipse cx="460" cy="472" rx="190" ry="16" fill="#D9C79A"/>
          <path d="M0,440 L70,440 L70,560 L0,560Z" fill="#8FB873"/>
          <path d="M930,440 L1000,440 L1000,560 L930,560Z" fill="#8FB873"/>
          <g id="house">
            <rect x="8" y="336" width="54" height="104" fill="#F4E3C3" stroke="#8A6A3A" stroke-width="2"/>
            <path d="M2,338 L35,312 L68,338Z" fill="#B5583C"/>
            <line x1="8" y1="388" x2="62" y2="388" stroke="#8A6A3A" stroke-width="2"/>
            <rect x="18" y="350" width="14" height="14" fill="#9FD3EC"/><rect x="40" y="350" width="14" height="14" fill="#9FD3EC"/>
            <rect x="18" y="400" width="14" height="14" fill="#9FD3EC"/><rect x="40" y="412" width="12" height="28" fill="#8A6A3A"/>
            <text x="35" y="300" text-anchor="middle" font-size="18" fill="#6A4A20" class="lbl">兩層樓</text>
          </g>
          <g id="bridgeAll">
            <g id="piers"></g>
            <g id="giants"></g>
            <rect x="70" y="328" width="860" height="9" fill="#8E2A22"/>
            <g id="cars">
              <g class="car"><rect x="0" y="309" width="44" height="18" rx="5" fill="#2F6FB3"/><rect x="8" y="302" width="26" height="10" rx="3" fill="#7FB3E3"/><circle cx="10" cy="327" r="4" fill="#222"/><circle cx="34" cy="327" r="4" fill="#222"/></g>
              <g class="car c2"><rect x="0" y="309" width="52" height="18" rx="5" fill="#F0A030"/><rect x="6" y="302" width="40" height="10" rx="3" fill="#FFE1A6"/><circle cx="12" cy="327" r="4" fill="#222"/><circle cx="42" cy="327" r="4" fill="#222"/></g>
            </g>
            <g id="arches"></g>
          </g>
          <g id="fest">
            <path d="M300,330 Q460,360 620,330" fill="none" stroke="#7A4A2A" stroke-width="1.5"/>
            <g id="lanterns"></g>
            <path d="M330,472 l22,-30 l22,30Z" fill="#E85D4A"/><path d="M400,472 l22,-30 l22,30Z" fill="#F0A030"/><path d="M500,472 l22,-30 l22,30Z" fill="#3B8EA5"/>
            <g id="crowd"></g>
            <rect x="380" y="380" width="170" height="40" rx="8" fill="#fff" stroke="#C7352B" stroke-width="3"/>
            <text x="465" y="408" text-anchor="middle" font-size="20" fill="#C7352B" class="lbl">西螺大橋觀光文化節</text>
          </g>
          <g id="bfw"></g>
        </svg>
      </div>

      <!-- TOWER -->
      <div class="scene" id="sc-tower">
        <svg id="tsvg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EC3E6"/><stop offset="1" stop-color="#E5F4FA"/></linearGradient>
            <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1838"/><stop offset="1" stop-color="#2C3E6B"/></linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3E8C80"/><stop offset=".45" stop-color="#9ED6CB"/><stop offset="1" stop-color="#2F7064"/></linearGradient>
            <clipPath id="above"><rect x="0" y="0" width="1000" height="530"/></clipPath>
          </defs>
          <rect id="skyR" width="1000" height="560"/>
          <g id="stars"></g>
          <path d="M0,530 L0,470 L60,470 L60,440 L120,440 L120,480 L200,480 L200,420 L260,420 L260,470 L330,470 L330,500 L380,500 L380,530Z M620,530 L620,490 L680,490 L680,430 L740,430 L740,470 L820,470 L820,410 L880,410 L880,460 L1000,460 L1000,530Z" fill="#9DB0BA" opacity=".8"/>
          <g clip-path="url(#above)">
            <g id="riseG"><g id="swayG">
              <line x1="500" y1="112" x2="500" y2="20" stroke="#5E7D79" stroke-width="5"/>

<script>
const $=s=>document.querySelector(s);
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let timers=[],loops=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function every(fn,ms){const t=setInterval(fn,ms);loops.push(t);return t;}
function stopAll(){timers.forEach(clearTimeout);loops.forEach(clearInterval);timers=[];loops=[];cancelSway();try{speechSynthesis.cancel()}catch(e){};$('#ov').innerHTML='';$('#pop').classList.remove('on');}
function ov(html,style,cls='badge'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,style);$('#ov').appendChild(d);return d;}
function countUp(node,to,ms,suffix=''){const t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/ms);node.textContent=Math.round(to*p).toLocaleString('zh-TW')+suffix;if(p<1&&node.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f);}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/\[\[|\]\]/g,''));u.lang='zh-TW';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}

/* ---------- vocabulary ---------- */
const VOC={
 "西螺大橋":"在雲林縣西螺鎮的紅色大橋，跨過濁水溪，連接彰化和雲林。",
 "公尺":"量長度的單位。一公尺大約是大人走一大步那麼長。",
 "亞洲":"世界上最大的一洲，臺灣就在亞洲。",
 "跨過":"從這一邊越過去，到達另一邊。",
 "濁水溪":"臺灣最長的河。河水裡有很多泥沙，看起來濁濁的。",
 "鋼鐵":"非常堅硬、很堅固的金屬。",
 "鋼拱隧道":"以鋼鐵製成的堅固三角形結構，數個三角形連結組合成的建築物，可供人車通行。",
 "保護":"照顧著它，不讓它受到傷害。",
 "層":"樓房的一樓、二樓就是一層、兩層。",

 "紙鈔":"用紙做的錢，例如一百元、五百元。",
 "仍是":"還是、依然是。",
 "地標":"一看到它，就知道是哪個地方的有名建築。",
 "金融":"和錢、銀行、做生意有關的事情。",
 "仰望":"抬起頭，往上看。",
 "內部":"裡面。",
 "阻尼器":"掛在大樓高處的大鋼球，重達660公噸。大樓被強風吹或地震時，它能讓搖晃變小。",
 "俯視":"從高的地方往下看。和「仰望」相反。",
 "煙火":"點火後飛上天空，炸開成五顏六色的火花。"
};
function showVocab(w){const p=$('#pop');p.innerHTML=`<h3>${w}</h3><div>${VOC[w]||''}</div><div class="row"><button id="pSay">🔊 念</button>${w==='阻尼器'?'<button id="pVid">🎬 看影片</button>':''}<button id="pClose">關閉</button></div>`;p.classList.add('on');if($('#pVid'))$('#pVid').onclick=()=>{p.classList.remove('on');VDAMP()};$('#pSay').onclick=()=>speak(w+'。'+VOC[w]);$('#pClose').onclick=()=>p.classList.remove('on');}

/* ---------- BRIDGE build ---------- */
const B={N:31,x0:70,W:860,D:330,T:278};
(function buildBridge(){
  const ag=$('#arches'),pg=$('#piers'),gg=$('#giants');const w=B.W/B.N;
  for(let i=0;i<B.N;i++){
    const x0=B.x0+i*w,x1=x0+w,xm=x0+w/2,q1=x0+w*.25,q3=x0+w*.75,D=B.D,T=B.T;
    const d=`M${x0},${D} L${x0},${D-12} L${q1},${T+8} L${xm},${T} L${q3},${T+8} L${x1},${D-12} L${x1},${D} M${x0},${D-12} L${q1},${T+8} L${xm},${D} L${q3},${T+8} L${x1},${D-12} M${xm},${T} L${xm},${D}`;
    const p=el('path',{d,class:'arch'},ag);p.style.setProperty('--i',i);
  }
  for(let j=0;j<=B.N;j++){
    const x=B.x0+j*w;
    el('rect',{x:x-6,y:B.D+8,width:12,height:132,class:'pier',rx:2},pg);
    el('path',{d:`M${x-5},${B.D+46} L${x-12},${B.D+10} M${x+5},${B.D+46} L${x+12},${B.D+10}`,stroke:'#6B655B','stroke-width':3,fill:'none','stroke-linecap':'round'},gg);
    el('circle',{cx:x-2.5,cy:B.D+60,r:1.8,fill:'#333'},gg);el('circle',{cx:x+2.5,cy:B.D+60,r:1.8,fill:'#333'},gg);
  }
  const lg=$('#lanterns');for(let k=0;k<9;k++){const x=310+k*38,y=330+Math.sin(k/8*Math.PI)*22+4;el('ellipse',{cx:x,cy:y+8,rx:7,ry:9,fill:k%2?'#F0A030':'#E85D4A'},lg);}
  const cg=$('#crowd');for(let k=0;k<16;k++){const x=300+k*20+(k%3)*4;el('circle',{cx:x,cy:458,r:5,fill:['#E85D4A','#3B8EA5','#F0A030','#6B8E23'][k%4]},cg);el('rect',{x:x-4,y:462,width:8,height:10,rx:3,fill:'#444'},cg);}
})();
function arches(){return [...document.querySelectorAll('#arches .arch')]}
function piers(){return [...document.querySelectorAll('#piers .pier')]}
function bsvg(){return $('#bsvg')}
function bridgeReset(){const s=bsvg();s.classList.remove('building','giants','fest','house','driving','flood','wave','glowbridge');arches().forEach(a=>a.classList.remove('hi','show'));piers().forEach(p=>p.classList.remove('hi'));$('#bfw').innerHTML='';}
function countThings(list,label,color){
  list.forEach(n=>n.classList.remove('hi'));
  const big=ov('',{left:'50%',top:'4%',transform:'translateX(-50%)'},'big');
  let i=0;every(function tick(){if(i>=list.length){return}list[i].classList.add('hi');i++;big.textContent=i;if(i===list.length){later(()=>{ov(`${label}一共有 ${list.length} ${color}`,{left:'50%',top:'24%',transform:'translateX(-50%)'},'badge gold')},300)}},230);
}
function fireworks(svg,cx,cy,n=1,spread=120){
  const g=svg;for(let k=0;k<n;k++){later(()=>{
    const x=cx+(Math.random()-.5)*spread*2,y=cy+(Math.random()-.5)*spread*.8;
    const col=['#FF4B3E','#FFD43B','#7CF7E0','#FF8FD8','#9DFF6B','#FFFFFF'][Math.floor(Math.random()*6)];
    const grp=el('g',{transform:`translate(${x},${y})`},g);
    for(let a=0;a<18;a++){const ang=a/18*Math.PI*2,r=40+Math.random()*30;const c=el('circle',{cx:0,cy:0,r:3.2,fill:col,class:'spark'},grp);c.style.setProperty('--dx',Math.cos(ang)*r+'px');c.style.setProperty('--dy',Math.sin(ang)*r+'px');}
    setTimeout(()=>grp.remove(),1800);
  },k*260)}
}

(function buildTower(){

    const yb=470-i*42,yt=yb-42;
    const g=el('g',{class:'sec','data-i':i},sg);

    el('path',{d:`M522,${yb-2} q-6,-8 0,-12 q6,-3 8,4 q2,-7 8,-4 q6,4 0,12Z`,fill:'#E9B949',stroke:'#8A6512','stroke-width':1},r);
  }
  const st=$('#stars');for(let k=0;k<60;k++)el('circle',{cx:Math.random()*1000,cy:Math.random()*380,r:Math.random()*1.8+.5,fill:'#fff',class:'tw',style:`animation-delay:${Math.random()*2}s`},st);
  const pg=$('#people');for(let k=0;k<12;k++){const g=el('g',{class:'walker'+(k%2?' back':''),style:`animation-delay:${-k*0.9}s;animation-duration:${8+k%5*2}s`},pg);el('circle',{cx:-20,cy:538,r:4,fill:['#FFD43B','#FF8FD8','#7CF7E0','#fff'][k%4]},g);el('rect',{x:-23,y:542,width:6,height:10,rx:2,fill:'#ddd'},g);}
  const ms=$('#mapStars');[[200,180],[300,300],[150,400],[260,140],[110,330],[330,170]].forEach(([x,y],k)=>{el('path',{d:`M${x},${y-10} L${x+3},${y-3} L${x+10},${y} L${x+3},${y+3} L${x},${y+10} L${x-3},${y+3} L${x-10},${y} L${x-3},${y-3}Z`,fill:'#FFF6B0',class:'tw',style:`animation-delay:${k*.3}s`},ms)});
  // end scene minis
  const mb=$('#miniBridge');const w=340/6;for(let i=0;i<6;i++){const x0=130+i*w;el('path',{d:`M${x0},380 L${x0},368 L${x0+w*.25},335 L${x0+w/2},328 L${x0+w*.75},335 L${x0+w},368 L${x0+w},380 M${x0},368 L${x0+w*.25},335 L${x0+w/2},380 L${x0+w*.75},335 L${x0+w},368`,class:'arch',style:'stroke-width:4'},mb);}
  el('rect',{x:130,y:378,width:340,height:7,fill:'#8E2A22'},mb);for(let i=0;i<=6;i++)el('rect',{x:126+i*w,y:385,width:9,height:35,class:'pier'},mb);
  const mt=$('#miniTower');for(let i=0;i<8;i++){const yb=380-i*32,yt=yb-32;el('path',{d:`M718,${yb} L762,${yb} L770,${yt} L710,${yt}Z`,fill:'url(#glass)',stroke:'#2E6A61','stroke-width':1.5},mt);}
  el('rect',{x:705,y:380,width:70,height:40,fill:'#7FB5AA',stroke:'#2E6A61'},mt);el('rect',{x:724,y:108,width:32,height:16,fill:'#8CC4B8',stroke:'#2E6A61'},mt);
})();

function towerReset(){const s=tsvg();s.classList.remove('stacking','cut','elev','walk','gaze','ding','night');$('#riseG').classList.remove('rise');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('show'));document.querySelectorAll('.sym').forEach(x=>x.classList.remove('hi'));$('#tfw').innerHTML='';$('#elev').setAttribute('y',floorY(5)-6);}

/* sway */
let swayRaf=null;
function cancelSway(){if(swayRaf)cancelAnimationFrame(swayRaf);swayRaf=null;const s=$('#swayG');if(s)s.removeAttribute('transform');const b=$('#dBall');if(b){b.setAttribute('cx',500);$('#dLine').setAttribute('x2',500);}}
function sway(withDamper){
  cancelSway();tsvg().classList.add('cut');
  $('#ov').querySelectorAll('.badge').forEach(b=>b.remove());
  ov(withDamper?'有阻尼器：大球往反方向擺，大樓搖得很小 😊':'沒有阻尼器：大樓搖得好厲害 😵',{left:'3%',top:'4%'},withDamper?'badge jade':'badge');
  ov('🌀 颱風來了！',{right:'4%',top:'4%'},'badge gold');
  const amp0=withDamper?0.9:3.6,t0=performance.now();
  $('#dBall').setAttribute('fill',withDamper?'#E9B949':'#AAA');
  const f=now=>{const t=(now-t0)/1000;const amp=amp0*Math.max(0,1-t/7);const a=amp*Math.sin(t*Math.PI*1.3);
    $('#swayG').setAttribute('transform',`rotate(${a} 500 530)`);
    const dx=withDamper?-a*7:a*1.5;$('#dBall').setAttribute('cx',500+dx);$('#dLine').setAttribute('x2',500+dx);
    if(t<7)swayRaf=requestAnimationFrame(f);else cancelSway();};
  swayRaf=requestAnimationFrame(f);
}
function rideElevator(){
  const s=tsvg();s.classList.add('cut','elev');cancelSway();
  $('#ov').querySelectorAll('.badge').forEach(b=>b.remove());
  const fl=ov('5 樓',{left:'3%',top:'4%'},'badge jade');const tm=ov('0 秒',{left:'3%',top:'16%'},'badge gold');
  const t0=performance.now(),dur=37000;const e=$('#elev');
  const f=now=>{if(!fl.isConnected)return;const p=Math.min(1,(now-t0)/dur);const floor=Math.round(5+84*p);e.setAttribute('y',floorY(floor)-6);fl.textContent=floor+' 樓';tm.textContent=Math.floor(p*37)+' 秒';
    if(p<1)requestAnimationFrame(f);else{tm.textContent='37 秒';ov('只要37秒，就從5樓到89樓觀景臺！',{left:'3%',top:'28%'},'badge');}};
  requestAnimationFrame(f);
}

const W5=[["人","當地人","國內外的觀光客、人們"],["事","落成時，曾是亞洲第一長橋；每年舉辦觀光文化節","完工時，成為世界第一高樓；每年的跨年煙火"],["時","民國四十一年","民國九十三年年底"],["地","雲林西螺，跨過濁水溪","臺北"],["物","鋼拱隧道、橋墩、以前的<span class='nlink' data-note>紙鈔</span>💵","阻尼器、超高速電梯、室內觀景平臺"]];

function openModal(html){$('#mbox').innerHTML=html+'<div class="mrow"><button id="mClose">關閉</button></div>';$('#modal').classList.add('on');$('#mClose').onclick=closeModal;$('#mClose').focus();}
function closeModal(){$('#modal').classList.remove('on');$('#mbox').innerHTML='';}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function banknote(){
  openModal(`<h3>💵 以前的紙鈔上，有西螺大橋！</h3><img src="${NOTE_IMG}" alt="臺灣銀行拾圓紙鈔，右邊印有西螺大橋"><div class="cap">這是臺灣銀行發行的「拾圓」紙鈔（中華民國四十九年）。<br>看看紙鈔的右邊，紅色和藍色的鋼拱大橋，就是西螺大橋。</div>`);
  speak('以前的紙鈔上有西螺大橋，看看紙鈔的右邊');
}
function video(title,id,start,isShort){
  const w=isShort?'min(42vh,80vw)':'min(80vw,120vh)',h=isShort?'min(74vh,142vw)':'min(45vw,67vh)';
  const src=`https://www.youtube-nocookie.com/embed/${id}?rel=0${start?'&start='+start:''}`;
  const url=isShort?`https://youtube.com/shorts/${id}`:`https://www.youtube.com/watch?v=${id}${start?'&t='+start+'s':''}`;
  try{speechSynthesis.cancel()}catch(e){}
  openModal(`<h3>🎬 ${title}</h3><iframe src="${src}" style="width:${w};height:${h}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><div class="mrow"><a href="${url}" target="_blank" rel="noopener">影片播不出來？到 YouTube 看</a></div>`);
}
function V101(){video('臺北一〇一','zQDRPFCYb2o',503,false)}
function VDAMP(){video('阻尼器怎麼保護大樓？','GgzUAEvjtcU',0,true)}
function riseAnim(){
  towerReset();const r=$('#riseG');void r.getBBox();r.classList.add('rise');
  const big=ov('0公尺',{left:'4%',top:'4%'},'big');countUp(big,508,3200,'公尺');
  later(()=>ov('民國93年年底 完工',{left:'4%',top:'24%'},'badge jade'),3300);
  later(()=>ov('🏆 當時的世界第一高樓',{left:'4%',top:'38%'},'badge gold'),4000);
}
function stackAnim(){
  towerReset();const s=tsvg();s.classList.add('stacking');const secs=[...document.querySelectorAll('.sec')];
  const lab=ov('',{left:'4%',top:'4%'},'badge jade');
  secs.forEach((x,i)=>later(()=>{x.classList.add('show');lab.textContent=`第 ${i+1} 節（每節 8 層樓）`},i*700));
  later(()=>{ov('8 個梯形 × 8 層 ＝ 64 層',{left:'4%',top:'18%'},'badge gold');ov('像竹子一節一節往上長 🎋',{left:'4%',top:'32%'},'badge')},8*700+200);
}
function countdown(){
  $('#ov').querySelectorAll('.big,.badge').forEach(b=>b.remove());const s=tsvg();s.classList.add('night');
  const big=ov('10',{left:'6%',top:'30%'},'big');let n=10;
  every(()=>{n--;if(n>0){big.textContent=n}else if(n===0){big.textContent='新年快樂！';speak('新年快樂');fireworks($('#tfw'),500,140,24,220)}},800);
  later(()=>ov('全世界都在看臺北一〇一的跨年煙火！',{right:'3%',top:'4%'},'badge gold'),8800+3000);
}
function worldSees(){
  const words=['Wow!','すごい！','Amazing Taiwan!','대단해요!','¡Increíble!','Incroyable !','Wunderbar!','太厲害了！'];
  words.forEach((w,i)=>later(()=>ov(w,{left:(5+Math.random()*70)+'%',top:(4+Math.random()*45)+'%'},'badge '+(i%2?'gold':'jade')),i*350));
  later(()=>ov('看見臺灣，令人驚羨！',{left:'50%',top:'60%',transform:'translateX(-50%)',fontSize:'4.4vh'},'badge'),words.length*350+300);
}

/* ---------- navigation ---------- */
const TABS=[['寶島',0],['西螺大橋',1],['臺北一〇一',5],['驕傲',9],['比高度',10],['人事時地物',11]];
TABS.forEach(([n,i])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(i);b.dataset.i=i;$('#tabs').appendChild(b)});
let cur=0;
function go(i){
  stopAll();cur=Math.max(0,Math.min(S.length-1,i));const st=S[cur];
  document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id==='sc-'+st.sc));
  if(st.sc==='bridge')bridgeReset();if(st.sc==='tower')towerReset();
  $('#ptag').textContent=st.tag;$('#pno').textContent=st.no;
  $('#txt').innerHTML=st.text.replace(/\[\[(.+?)\]\]/g,(m,w)=>`<span class="v" role="button" tabindex="0" data-w="${w}">${w}</span>`);
  $('#txt').querySelectorAll('.v').forEach(v=>{v.onclick=()=>showVocab(v.dataset.w);v.onkeydown=e=>{if(e.key==='Enter'){showVocab(v.dataset.w)}}});
  const A=$('#acts');A.innerHTML='';st.acts.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;A.appendChild(b)});
  let active=0;TABS.forEach(([n,ti])=>{if(cur>=ti)active=ti});
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===active));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===S.length-1;
  st.enter&&st.enter();
}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#say').onclick=()=>speak(S[cur].text);
$('#pinY').onclick=()=>go(1);$('#pinT').onclick=()=>go(5);
document.addEventListener('keydown',e=>{if(e.target.closest('.v,.cell'))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
go(0);
</script>
